target: all

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 14295

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 17946

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 127.0.0.1:14317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    block:
      version: vParquet5

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 72h

usage_report:
  reporting_enabled: false
