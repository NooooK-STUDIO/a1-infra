services:
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: a1-monitoring-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.listen-address=127.0.0.1:9090
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    container_name: a1-monitoring-grafana
    depends_on:
      - prometheus
      - loki
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_METRICS_ENABLED: "true"
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${GRAFANA_HOST_PORT:-3000}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://nooook-monitoring.duckdns.org}
      NOOOOK_DISCORD_WEBHOOK_URL: ${NOOOOK_DISCORD_WEBHOOK_URL:?NOOOOK_DISCORD_WEBHOOK_URL is required}
      GRAFANA_DISCORD_DEV_WEBHOOK_URL: ${GRAFANA_DISCORD_DEV_WEBHOOK_URL:?GRAFANA_DISCORD_DEV_WEBHOOK_URL is required}
      GRAFANA_DISCORD_PROD_WEBHOOK_URL: ${GRAFANA_DISCORD_PROD_WEBHOOK_URL:?GRAFANA_DISCORD_PROD_WEBHOOK_URL is required}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.2
    container_name: a1-monitoring-loki
    command:
      - -config.file=/etc/loki/loki.yml
    network_mode: host
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.9.1
    container_name: a1-monitoring-alloy
    depends_on:
      - loki
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    network_mode: host
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/caddy:/var/log/caddy:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: a1-monitoring-node-exporter
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/docker/.+|var/lib/docker/.+)($|/)
    pid: host
    ports:
      - target: 9100
        published: "9100"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: a1-monitoring-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - target: 8080
        published: "18082"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: a1-monitoring-blackbox-exporter
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
      - --web.listen-address=127.0.0.1:9115
    network_mode: host
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    container_name: a1-monitoring-postgres-exporter
    command:
      - --web.listen-address=127.0.0.1:9187
    network_mode: host
    environment:
      DATA_SOURCE_URI: 127.0.0.1:15432/postgres?sslmode=disable
      DATA_SOURCE_USER: reading_garden_monitoring
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?POSTGRES_EXPORTER_PASSWORD is required}
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
