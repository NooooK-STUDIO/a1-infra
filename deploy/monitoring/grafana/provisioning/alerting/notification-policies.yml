apiVersion: 1

policies:
  - orgId: 1
    receiver: nooook-discord
    group_by:
      - grafana_folder
      - alertname
      - source_alert
      - service
      - env
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: reading-garden-discord-prod
        object_matchers:
          - - service
            - =
            - reading-garden-kotlin
          - - env
            - =
            - prod
        group_by:
          - grafana_folder
          - alertname
          - source_alert
          - service
          - env
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
