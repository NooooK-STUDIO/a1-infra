apiVersion: 1

deleteContactPoints:
  - orgId: 1
    uid: reading-garden-discord

  - orgId: 1
    uid: reading-garden-discord-dev

contactPoints:
  - orgId: 1
    name: nooook-discord
    receivers:
      - uid: nooook-discord
        type: discord
        disableResolveMessage: false
        settings:
          url: $NOOOOK_DISCORD_WEBHOOK_URL
          use_discord_username: false
          title: '{{ template "reading_garden_discord.title" . }}'
          message: '{{ template "reading_garden_discord.message" . }}'
  - orgId: 1
    name: reading-garden-discord-prod
    receivers:
      - uid: reading-garden-discord-prod
        type: discord
        disableResolveMessage: false
        settings:
          url: $GRAFANA_DISCORD_PROD_WEBHOOK_URL
          use_discord_username: false
          title: '{{ template "reading_garden_discord.title" . }}'
          message: '{{ template "reading_garden_discord.message" . }}'
