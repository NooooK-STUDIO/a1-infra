---
apiVersion: 1
deleteRules:
  - orgId: 1
    uid: grafana-prod-external-health
  - orgId: 1
    uid: grafana-dev-external-health

  - orgId: 1
    uid: grafana-dev-local-caddy-health
  - orgId: 1
    uid: grafana-dev-public-external-health
  - orgId: 1
    uid: grafana-dev-app-metrics
  - orgId: 1
    uid: grafana-dev-app-error-logs

  - orgId: 1
    uid: grafana-prod-local-caddy-health
  - orgId: 1
    uid: grafana-prod-public-external-health
  - orgId: 1
    uid: grafana-prod-app-metrics
  - orgId: 1
    uid: grafana-caddy-metrics
  - orgId: 1
    uid: grafana-host-disk-full
groups:
- orgId: 1
  name: monitoring-alerts
  folder: ReadingGarden Alerts
  interval: 60s
  rules:
  - uid: prometheus-alert-forwarder
    title: PrometheusAlertFiring
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: 'label_replace(ALERTS{alertstate="firing"}, "source_alert", "$1", "alertname", "(.*)")'
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: "$A > 0"
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: math
    noDataState: OK
    execErrState: Alerting
    for: 0s
    annotations:
      summary: Prometheus alert is firing; see source_alert and labels.
  - uid: grafana-prod-app-error-logs
    title: GrafanaProdAppErrorLogsDetected
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        datasource:
          type: loki
          uid: loki
        editorMode: code
        expr: 'sum(count_over_time({container=~"reading-garden-prod-.*"} |~ "(?i)([[:space:]]ERROR[[:space:]]|level=error|exception|traceback|NullPointerException|IllegalStateException|DataAccessException|ResponseStatusException)" !~ "(?i)(no error|error page|error dispatch)" !~ "(?i)FCM (HTTP error|send failed): .*?(fcmErrorCode|errorCode)=(UNREGISTERED|messaging/registration-token-not-registered)" [5m]))'
        intervalMs: 1000
        maxDataPoints: 43200
        queryType: range
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: "$B > 0"
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: math
    noDataState: OK
    execErrState: Alerting
    for: 1m
    annotations:
      summary: Prod app error logs were detected in Loki.
      logs_dashboard: https://nooook-monitoring.duckdns.org/d/reading-garden-logs?orgId=1&from=now-30m&to=now
      logs_query: '{container=~"reading-garden-prod-.*"} |~ "(?i)([[:space:]]ERROR[[:space:]]|level=error|exception|traceback|NullPointerException|IllegalStateException|DataAccessException|ResponseStatusException)" !~ "(?i)(no error|error page|error dispatch)" !~ "(?i)FCM (HTTP error|send failed): .*?(fcmErrorCode|errorCode)=(UNREGISTERED|messaging/registration-token-not-registered)"'
    labels:
      service: reading-garden-kotlin
      env: prod
      signal: logs
      severity: warning
  - uid: grafana-paw-prod-app-error-logs
    title: GrafanaPawProdAppErrorLogsDetected
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        datasource:
          type: loki
          uid: loki
        editorMode: code
        expr: 'sum(count_over_time({container=~"pawtogether-prod-.*"} |~ "(?i)([[:space:]]ERROR[[:space:]]|level=error|exception|traceback|NullPointerException|IllegalStateException|DataAccessException|ResponseStatusException)" !~ "(?i)(no error|error page|error dispatch)" !~ "(?i)FCM (HTTP error|send failed): .*?(fcmErrorCode|errorCode)=(UNREGISTERED|messaging/registration-token-not-registered)" [5m]))'
        intervalMs: 1000
        maxDataPoints: 43200
        queryType: range
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: "$B > 0"
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: math
    noDataState: OK
    execErrState: Alerting
    for: 1m
    annotations:
      summary: PawTogether prod app error logs were detected in Loki.
      logs_dashboard: https://nooook-monitoring.duckdns.org/d/pawtogether-logs?orgId=1&from=now-30m&to=now
      logs_query: '{container=~"pawtogether-prod-.*"} |~ "(?i)([[:space:]]ERROR[[:space:]]|level=error|exception|traceback|NullPointerException|IllegalStateException|DataAccessException|ResponseStatusException)" !~ "(?i)(no error|error page|error dispatch)" !~ "(?i)FCM (HTTP error|send failed): .*?(fcmErrorCode|errorCode)=(UNREGISTERED|messaging/registration-token-not-registered)"'
    labels:
      service: pawtogether
      env: prod
      signal: logs
      severity: warning
