apiVersion: 1

groups:
  - orgId: 1
    name: reading-garden-alerts
    folder: ReadingGarden Alerts
    interval: 60s
    rules:
      - uid: grafana-dev-external-health
        title: GrafanaDevExternalHealthDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 1 - max(probe_success{job="blackbox-http",instance="https://readinggarden-dev.duckdns.org/api/health"} or vector(0))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: Dev external health is down.
          runbook_url: https://github.com/ReadingGarden/a1-infra/blob/main/deploy/monitoring/RUNBOOK.md
        labels:
          service: reading-garden
          env: dev
          severity: critical

      - uid: grafana-prod-external-health
        title: GrafanaProdExternalHealthDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 1 - max(probe_success{job="blackbox-http",instance="https://readinggarden.duckdns.org/api/health"} or vector(0))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: Prod external health is down.
          runbook_url: https://github.com/ReadingGarden/a1-infra/blob/main/deploy/monitoring/RUNBOOK.md
        labels:
          service: reading-garden
          env: prod
          severity: critical

      - uid: grafana-dev-app-metrics
