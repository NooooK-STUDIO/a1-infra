global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          env: infra
          service: monitoring
          component: prometheus

  - job_name: reading-garden-dev-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 127.0.0.1:19090
          - 127.0.0.1:19091
        labels:
          env: dev
          service: reading-garden-kotlin
          component: app

  - job_name: reading-garden-prod-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 127.0.0.1:19080
          - 127.0.0.1:19081
        labels:
          env: prod
          service: reading-garden-kotlin
          component: app

  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:2019
        labels:
          env: infra
          service: caddy
          component: caddy

  - job_name: node-exporter
    static_configs:
      - targets:
          - 127.0.0.1:9100
        labels:
          env: infra
          service: host
          component: host

  - job_name: cadvisor
    static_configs:
      - targets:
          - 127.0.0.1:18082
        labels:
          env: infra
          service: docker
          component: container

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - 127.0.0.1:9187
        labels:
          env: infra
          service: postgres
          component: database

  - job_name: blackbox-public-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://readinggarden-dev.duckdns.org/api/health
        labels:
          env: dev
          service: reading-garden-kotlin
          component: blackbox-public
      - targets:
          - https://readinggarden.duckdns.org/api/health
        labels:
          env: prod
          service: reading-garden-kotlin
          component: blackbox-public
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: blackbox-local-caddy
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://127.0.0.1/api/health
        labels:
          env: dev
          hostname: readinggarden-dev.duckdns.org
          service: reading-garden-kotlin
          component: blackbox-local-caddy
      - targets:
          - https://127.0.0.1/api/health
        labels:
          env: prod
          hostname: readinggarden.duckdns.org
          service: reading-garden-kotlin
          component: blackbox-local-caddy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [hostname]
        target_label: __param_hostname
      - source_labels: [hostname]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
