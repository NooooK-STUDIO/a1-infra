groups:
  - name: pawtogether-prod
    rules:
      - alert: ProdAppMetricsDown
        expr: (sum(up{job="pawtogether-prod-app"}) or vector(0)) == 0
        for: 1m
        labels:
          severity: critical
          env: prod
          service: pawtogether
          component: app
        annotations:
          summary: PawTogether prod actuator metrics target is down

      - alert: ProdLocalCaddyHealthDown
        expr: (probe_success{job="blackbox-local-caddy",service="pawtogether"} == 0) or absent(probe_success{job="blackbox-local-caddy",service="pawtogether"})
        for: 1m
        labels:
          severity: critical
          env: prod
          service: pawtogether
          component: blackbox-local-caddy
        annotations:
          summary: PawTogether prod local Caddy health probe is failing

      - alert: ProdPublicExternalHealthDown
        expr: (probe_success{job="blackbox-public-http",service="pawtogether"} == 0) or absent(probe_success{job="blackbox-public-http",service="pawtogether"})
        for: 5m
        labels:
          severity: warning
          env: prod
          service: pawtogether
          component: blackbox-public
        annotations:
          summary: PawTogether prod public health probe is failing

      - alert: Prod5xxRateHigh
        expr: sum(rate(http_server_requests_seconds_count{job="pawtogether-prod-app",status=~"5.."}[5m])) > 0
        for: 1m
        labels:
          severity: warning
          env: prod
          service: pawtogether
          component: app
        annotations:
          summary: PawTogether prod is returning HTTP 5xx responses

      - alert: ProdAvgLatencyHigh
        expr: sum(rate(http_server_requests_seconds_sum{job="pawtogether-prod-app"}[5m])) / sum(rate(http_server_requests_seconds_count{job="pawtogether-prod-app"}[5m])) > 0.75
        for: 5m
        labels:
          severity: warning
          env: prod
          service: pawtogether
          component: app
        annotations:
          summary: PawTogether prod average HTTP latency is above 750 ms

      - alert: ProdHikariPendingConnections
        expr: sum(hikaricp_connections_pending{job="pawtogether-prod-app"}) > 0
        for: 2m
        labels:
          severity: warning
          env: prod
          service: pawtogether
          component: app
        annotations:
          summary: PawTogether prod has pending database pool connections
