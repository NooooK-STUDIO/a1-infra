groups:
  - name: reading-garden-prod
    rules:
      - alert: ProdAppMetricsDown
        expr: sum(up{job="reading-garden-prod-app"}) == 0
        for: 1m
        labels:
          severity: critical
          env: prod
          service: reading-garden-kotlin
          component: app
        annotations:
          summary: ReadingGarden prod actuator metrics target is down

      - alert: ProdLocalCaddyHealthDown
        expr: probe_success{job="blackbox-local-caddy",env="prod"} == 0
        for: 1m
        labels:
          severity: critical
          env: prod
          service: reading-garden-kotlin
          component: blackbox-local-caddy
        annotations:
          summary: ReadingGarden prod local Caddy health probe is failing

      - alert: ProdPublicExternalHealthDown
        expr: probe_success{job="blackbox-public-http",instance="https://readinggarden.duckdns.org/api/health"} == 0
        for: 5m
        labels:
          severity: warning
          env: prod
          service: reading-garden-kotlin
          component: blackbox-public
        annotations:
          summary: ReadingGarden prod public health probe is failing

      - alert: Prod5xxRateHigh
        expr: sum(rate(http_server_requests_seconds_count{job="reading-garden-prod-app",status=~"5.."}[5m])) > 0
        for: 1m
        labels:
          severity: warning
          env: prod
          service: reading-garden-kotlin
          component: app
        annotations:
          summary: ReadingGarden prod is returning HTTP 5xx responses

      - alert: ProdAvgLatencyHigh
        expr: sum(rate(http_server_requests_seconds_sum{job="reading-garden-prod-app"}[5m])) / sum(rate(http_server_requests_seconds_count{job="reading-garden-prod-app"}[5m])) > 0.75
        for: 5m
        labels:
          severity: warning
          env: prod
          service: reading-garden-kotlin
          component: app
        annotations:
          summary: ReadingGarden prod average HTTP latency is above 750 ms

      - alert: ProdHikariPendingConnections
        expr: sum(hikaricp_connections_pending{job="reading-garden-prod-app"}) > 0
        for: 2m
        labels:
          severity: warning
          env: prod
          service: reading-garden-kotlin
          component: app
        annotations:
          summary: ReadingGarden prod has pending database pool connections
