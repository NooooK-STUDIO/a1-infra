groups:
  - name: reading-garden-prod
    rules:
      - alert: ProdAppMetricsDown
        expr: sum(up{job="reading-garden-prod-app"}) == 0
        for: 1m
        labels:
          severity: critical
          env: prod
          service: reading-garden-kotlin
          component: app
        annotations:
          summary: ReadingGarden prod actuator metrics target is down
          runbook: Check prod blue/green containers and management port 8081 on the shared backend network.

      - alert: ProdExternalHealthDown
        expr: probe_success{job="blackbox-http",instance="https://readinggarden.duckdns.org/api/health"} == 0
        for: 1m
        labels:
          severity: critical
          env: prod
          service: reading-garden-kotlin
          component: blackbox
        annotations:
          summary: ReadingGarden prod public health probe is failing
          runbook: Check host Caddy, prod upstream, and the public prod health endpoint.

      - alert: Prod5xxRateHigh
        expr: sum(rate(http_server_requests_seconds_count{job="reading-garden-prod-app",status=~"5.."}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          env: prod
          service: reading-garden-kotlin
          component: app
        annotations:
          summary: ReadingGarden prod is returning HTTP 5xx responses
          runbook: Check prod application logs, recent deployments, and upstream error responses.

      - alert: ProdAvgLatencyHigh
        expr: sum(rate(http_server_requests_seconds_sum{job="reading-garden-prod-app"}[5m])) / sum(rate(http_server_requests_seconds_count{job="reading-garden-prod-app"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
          env: prod
          service: reading-garden-kotlin
          component: app
        annotations:
          summary: ReadingGarden prod average HTTP latency is above 1 second
          runbook: Check slow endpoints, database latency, and current prod traffic.

      - alert: ProdHikariPendingConnections
        expr: sum(hikaricp_connections_pending{job="reading-garden-prod-app"}) > 0
        for: 5m
        labels:
          severity: warning
          env: prod
          service: reading-garden-kotlin
          component: app
        annotations:
          summary: ReadingGarden prod has pending database pool connections
          runbook: Check shared PostgreSQL health, active queries, and Hikari pool saturation.
